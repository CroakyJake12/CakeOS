name: HavenOS package admission

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/Data/**"
      - "apps/present-engine/**"
      - "compatibility/wine/**"
      - "packaging/cohort/**"
      - ".github/workflows/cohort-packages.yml"

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable package admission metadata
        run: python3 packaging/cohort/verify-admission.py
      - name: Validate immutable package staging helper syntax
        run: bash -n packaging/llamacpp/stage-cohort.sh
      - name: Upload package admission record
        uses: actions/upload-artifact@v4
        with:
          name: havenos-cohort-admission-${{ github.sha }}
          path: |
            packaging/cohort/ADMISSION.md
            packaging/llamacpp/cohort-artifact.lock.json
          if-no-files-found: error
          retention-days: 30
