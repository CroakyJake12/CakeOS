name: One-shot Haven Data Calc sort patch

on:
  push:
    branches:
      - data-calc-duckdb-first-slice
    paths:
      - '.github/workflows/data-sort-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-calc-duckdb-first-slice
          fetch-depth: 0

      - name: Patch Calc worker sort endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/Data/workers/calc_worker.py')
          text = path.read_text(encoding='utf-8')

          method = '''    def sort_range(self, workbook_id: str, request: dict, key_column_offset: object, ascending: bool, contains_header: bool) -> dict:\n        document = self._doc(workbook_id)\n        if bool(document.isReadonly()):\n            raise PermissionError("Workbook was opened read-only.")\n        _sheet, cell_range, normalized = self._bounded_cell_range(document, request, "Sort range")\n        key = int(key_column_offset)\n        if key < 0 or key >= normalized["columnCount"]:\n            raise ValueError("Sort key must identify a column inside the requested range.")\n        if contains_header and normalized["rowCount"] < 2:\n            raise ValueError("A sort range marked as containing a header must include at least one data row.")\n\n        descriptor = list(cell_range.createSortDescriptor())\n        sort_field = uno.createUnoStruct("com.sun.star.util.SortField")\n        sort_field.Field = key\n        sort_field.SortAscending = bool(ascending)\n\n        seen: set[str] = set()\n        for item in descriptor:\n            if item.Name == "SortFields":\n                item.Value = (sort_field,)\n                seen.add(item.Name)\n            elif item.Name == "ContainsHeader":\n                item.Value = bool(contains_header)\n                seen.add(item.Name)\n            elif item.Name == "SortColumns":\n                item.Value = False\n                seen.add(item.Name)\n            elif item.Name == "IsCaseSensitive":\n                item.Value = False\n            elif item.Name == "BindFormatsToContent":\n                item.Value = True\n            elif item.Name == "CopyOutputData":\n                item.Value = False\n            elif item.Name == "IsUserListEnabled":\n                item.Value = False\n\n        required = {"SortFields", "ContainsHeader", "SortColumns"}\n        missing = required.difference(seen)\n        if missing:\n            raise RuntimeError(f"LibreOffice sort descriptor is missing required properties: {sorted(missing)}")\n\n        cell_range.sort(tuple(descriptor))\n        document.calculateAll()\n        return self.read_range(workbook_id, normalized)\n\n'''

          anchor = '    def read_range(self, workbook_id: str, request: dict) -> dict:\n'
          if '    def sort_range(' not in text:
              if anchor not in text:
                  raise SystemExit('sort method insertion anchor not found')
              text = text.replace(anchor, method + anchor, 1)

          dispatch = '''                elif method == "sortRange":\n                    result = runtime.sort_range(\n                        params["workbookId"],\n                        params["range"],\n                        params["keyColumnOffset"],\n                        bool(params.get("ascending", True)),\n                        bool(params.get("containsHeader", True)),\n                    )\n'''
          dispatch_anchor = '                elif method == "readRange":\n'
          if '                elif method == "sortRange":' not in text:
              if dispatch_anchor not in text:
                  raise SystemExit('sort dispatch insertion anchor not found')
              text = text.replace(dispatch_anchor, dispatch + dispatch_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/data-sort-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/Data/workers/calc_worker.py .github/workflows/data-sort-patch.yml
          git diff --cached --check
          git commit -m 'Implement whitelisted Calc single-key sort worker'
          git push origin HEAD:data-calc-duckdb-first-slice
