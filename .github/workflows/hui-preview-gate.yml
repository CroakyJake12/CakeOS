name: HUI preview gate

on:
  push:
    branches:
      - platform/hui-preview-gate1
  workflow_dispatch:

concurrency:
  group: hui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out CakeOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate provenance before staging
        run: bash tests/verify-hui-preview.sh

      - name: Stage pinned HUI donor
        run: bash HUI/stage-donor.sh

      - name: Validate staged HUI boundary
        run: bash tests/verify-hui-preview.sh

      - name: Build and execute Linux HUI smoke preview
        run: bash HUI/build-preview.sh

      - name: Verify self-contained Linux runtime closure
        run: |
          preview=artifacts/hui-preview/publish/cakeos-hui-preview
          test -x "$preview"
          ldd "$preview" | tee artifacts/hui-preview/native-dependencies.txt
          if grep -q 'not found' artifacts/hui-preview/native-dependencies.txt; then
            echo 'Self-contained HUI preview has unresolved native dependencies' >&2
            exit 1
          fi
          test ! -e artifacts/hui-preview/publish/cakeos-hui-preview.runtimeconfig.json || \
            ! grep -q 'Microsoft.NETCore.App' artifacts/hui-preview/publish/cakeos-hui-preview.runtimeconfig.json

      - name: Build reproducible Debian preview package twice
        run: |
          bash packaging/haven-hui-preview/build-deb.sh
          package=artifacts/packages/haven-hui-preview_0.1.0_amd64.deb
          first="$(sha256sum "$package" | awk '{print $1}')"
          cp "$package" artifacts/packages/haven-hui-preview_0.1.0_amd64.first.deb
          sleep 2
          bash packaging/haven-hui-preview/build-deb.sh
          second="$(sha256sum "$package" | awk '{print $1}')"
          test "$first" = "$second" || {
            echo "Package is not reproducible: $first != $second" >&2
            exit 1
          }
          cmp artifacts/packages/haven-hui-preview_0.1.0_amd64.first.deb "$package"
          rm artifacts/packages/haven-hui-preview_0.1.0_amd64.first.deb
          echo "Deterministic package SHA256: $second"

      - name: Inspect package payload and metadata
        run: |
          package=artifacts/packages/haven-hui-preview_0.1.0_amd64.deb
          dpkg-deb --contents "$package"
          dpkg-deb --field "$package" Package Version Architecture Depends Description
          test "$(dpkg-deb --field "$package" Package)" = 'haven-hui-preview'
          test "$(dpkg-deb --field "$package" Architecture)" = 'amd64'
          if dpkg-deb --field "$package" Depends | grep -q 'dotnet-runtime'; then
            echo 'Preview package unexpectedly depends on a system .NET runtime' >&2
            exit 1
          fi
          test -s artifacts/hui-preview/render-summary.json
          jq -e '.platform == "Linux" and .drawCommandCount > 0' artifacts/hui-preview/render-summary.json >/dev/null
          cat artifacts/hui-preview/render-summary.json

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hui-preview-gate
          path: |
            artifacts/hui-preview/render-summary.json
            artifacts/hui-preview/native-dependencies.txt
            artifacts/packages/haven-hui-preview_0.1.0_amd64.deb
            artifacts/packages/haven-hui-preview_0.1.0_amd64.deb.sha256
          if-no-files-found: error
