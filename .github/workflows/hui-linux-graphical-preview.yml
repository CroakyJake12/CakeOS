name: HUI Linux graphical preview

on:
  push:
    branches:
      - platform/hui-linux-graphical-preview
  workflow_dispatch:

concurrency:
  group: hui-linux-graphical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphical-preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out stacked runtime branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install graphical validation tools
        run: sudo apt-get update && sudo apt-get install -y jq xvfb imagemagick openbox xdotool x11-utils file

      - name: Validate and stage pinned HUI source
        run: |
          bash tests/verify-hui-preview.sh
          bash HUI/stage-donor.sh
          bash tests/verify-hui-preview.sh

      - name: Build graphical Linux host
        run: bash HUI/build-linux-host.sh

      - name: Check all shipped ELF native dependencies
        run: |
          publish=artifacts/hui-linux-host/publish
          report=artifacts/hui-linux-host/native-dependencies.txt
          : > "$report"
          unresolved=0
          elf_count=0
          while IFS= read -r -d '' candidate; do
            if file -b "$candidate" | grep -q '^ELF '; then
              elf_count=$((elf_count + 1))
              printf '### %s\n' "$candidate" >> "$report"
              deps="$(ldd "$candidate" 2>&1 || true)"
              printf '%s\n\n' "$deps" >> "$report"
              if grep -q 'not found' <<<"$deps"; then
                unresolved=1
              fi
            fi
          done < <(find "$publish" -type f -print0)
          cat "$report"
          test "$elf_count" -gt 0
          if test "$unresolved" -ne 0; then
            echo 'Graphical HUI host has unresolved native dependencies' >&2
            exit 1
          fi
          echo "Checked native closure for $elf_count shipped ELF files."

      - name: Run real window, exercise HUI input, and capture screenshot
        run: |
          mkdir -p artifacts/hui-linux-host
          set +e
          xvfb-run -a -s '-screen 0 1280x800x24' bash -c '
            set +e
            openbox > artifacts/hui-linux-host/openbox.log 2>&1 &
            wm_pid=$!
            export CAKEOS_HUI_PREVIEW_SELF_TEST=1
            export CAKEOS_HUI_PREVIEW_AUTO_EXIT_MS=12000
            artifacts/hui-linux-host/publish/cakeos-hui-linux-preview > artifacts/hui-linux-host/window.log 2>&1 &
            pid=$!

            window_id=""
            for attempt in $(seq 1 100); do
              window_id=$(xdotool search --pid "$pid" --onlyvisible 2>/dev/null | head -n 1)
              if test -z "$window_id"; then
                window_id=$(xdotool search --name "CakeOS HUI Linux Preview" 2>/dev/null | head -n 1)
              fi
              if test -n "$window_id"; then break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.1
            done

            xwininfo -root -tree > artifacts/hui-linux-host/x11-window-tree.txt 2>&1 || true

            if test -n "$window_id"; then
              xdotool windowmap "$window_id" >/dev/null 2>&1
              xdotool windowraise "$window_id" >/dev/null 2>&1 || true
              sleep 0.75
              import -window "$window_id" artifacts/hui-linux-host/window.png
              screenshot_status=$?
              printf "%s\n" "$window_id" > artifacts/hui-linux-host/window-id.txt
            else
              screenshot_status=20
              printf "%s\n" "window-not-found" > artifacts/hui-linux-host/window-id.txt
            fi

            wait "$pid"
            app_status=$?
            kill "$wm_pid" >/dev/null 2>&1 || true
            printf "%s\n" "$app_status" > artifacts/hui-linux-host/app-exit-code.txt
            printf "%s\n" "$screenshot_status" > artifacts/hui-linux-host/screenshot-exit-code.txt
            if test "$app_status" -ne 0; then exit "$app_status"; fi
            exit "$screenshot_status"
          '
          runtime_status=$?
          set -e
          test -e artifacts/hui-linux-host/window.log || touch artifacts/hui-linux-host/window.log
          echo '--- application log ---'
          cat artifacts/hui-linux-host/window.log
          echo '--- X11 window tree ---'
          cat artifacts/hui-linux-host/x11-window-tree.txt 2>/dev/null || true
          if test -s artifacts/hui-linux-host/window.png; then
            identify artifacts/hui-linux-host/window.png | tee artifacts/hui-linux-host/screenshot-info.txt
          else
            echo 'No application-window screenshot was captured.' | tee artifacts/hui-linux-host/screenshot-info.txt
          fi
          echo "Runtime status: $runtime_status"
          exit "$runtime_status"

      - name: Build reproducible graphical Debian package
        run: |
          version="0.1.0+git${GITHUB_SHA::12}"
          export CAKEOS_HUI_PREVIEW_VERSION="$version"
          package="artifacts/packages/haven-hui-preview_${version}_amd64.deb"

          bash packaging/haven-hui-preview/build-deb.sh
          cp "$package" "$package.first"
          bash packaging/haven-hui-preview/build-deb.sh
          cmp "$package.first" "$package"
          rm "$package.first"

          sha256sum "$package" | tee artifacts/packages/graphical-package.sha256
          dpkg-deb --info "$package" | tee artifacts/packages/graphical-package-info.txt
          dpkg-deb --contents "$package" | tee artifacts/packages/graphical-package-contents.txt

          rm -rf artifacts/packages/extracted
          dpkg-deb -x "$package" artifacts/packages/extracted
          test -x artifacts/packages/extracted/usr/lib/cakeos/hui-preview/cakeos-hui-linux-preview
          test -x artifacts/packages/extracted/usr/bin/cakeos-hui-preview
          grep -Fxq 'Name=CakeOS HUI Preview' artifacts/packages/extracted/usr/share/applications/cakeos-hui-preview.desktop
          grep -Fxq 'Exec=cakeos-hui-preview' artifacts/packages/extracted/usr/share/applications/cakeos-hui-preview.desktop
          echo 'Graphical Debian package is byte-reproducible from the same publish payload.'

      - name: Upload graphical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hui-linux-graphical-preview
          path: |
            artifacts/hui-linux-host/window.png
            artifacts/hui-linux-host/window.log
            artifacts/hui-linux-host/openbox.log
            artifacts/hui-linux-host/window-id.txt
            artifacts/hui-linux-host/x11-window-tree.txt
            artifacts/hui-linux-host/screenshot-info.txt
            artifacts/hui-linux-host/native-dependencies.txt
            artifacts/hui-linux-host/app-exit-code.txt
            artifacts/hui-linux-host/screenshot-exit-code.txt
          if-no-files-found: warn

      - name: Upload graphical Debian package
        uses: actions/upload-artifact@v4
        with:
          name: hui-linux-graphical-package
          path: |
            artifacts/packages/haven-hui-preview_*.deb
            artifacts/packages/graphical-package.sha256
            artifacts/packages/graphical-package-info.txt
            artifacts/packages/graphical-package-contents.txt
          if-no-files-found: error
