name: Canvas Rnote PoC

on:
  push:
    branches:
      - migration/canvas-rnote-poc
    paths:
      - 'apps/canvas/rnote-poc/**'
      - '.github/workflows/canvas-rnote-poc.yml'
  pull_request:
    paths:
      - 'apps/canvas/rnote-poc/**'
      - '.github/workflows/canvas-rnote-poc.yml'

jobs:
  headless-rnote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install native core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            librsvg2-dev

      - name: Generate lockfile
        run: cargo generate-lockfile --manifest-path apps/canvas/rnote-poc/Cargo.toml

      - name: Reject GTK and Libadwaita in core dependency graph
        shell: bash
        run: |
          cargo tree --manifest-path apps/canvas/rnote-poc/Cargo.toml | tee /tmp/canvas-rnote-tree.txt
          if grep -E '(^|[[:space:]])(gtk4|libadwaita)[[:space:]]' /tmp/canvas-rnote-tree.txt; then
            echo 'Headless Canvas core unexpectedly depends on GTK4 or Libadwaita.' >&2
            exit 1
          fi

      - name: Test headless pressure/save/reload/export round trip
        run: cargo test --manifest-path apps/canvas/rnote-poc/Cargo.toml --all-targets --verbose
