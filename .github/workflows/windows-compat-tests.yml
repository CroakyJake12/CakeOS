name: Windows compatibility broker tests

on:
  push:
    branches:
      - feature/windows-compat-broker
  pull_request:
    paths:
      - 'compatibility/wine/**'
      - 'tests/test_haven_compat*.py'
      - '.github/workflows/windows-compat-tests.yml'

permissions:
  contents: read

jobs:
  compatibility-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile compatibility broker
        run: python -m compileall -q compatibility/wine/haven_compat

      - name: Validate acceptance harness syntax
        run: bash -n compatibility/wine/acceptance.sh

      - name: Validate acceptance harness help path
        run: bash compatibility/wine/acceptance.sh --help

      - name: Verify rendered user service
        shell: bash
        run: |
          set -euo pipefail
          source_root="$PWD"
          python_path="$(command -v python)"
          rendered="$RUNNER_TEMP/haven-compatd.service"
          sed \
            -e "s|@PYTHON@|$python_path|g" \
            -e "s|@SOURCE_ROOT@|$source_root|g" \
            -e "s|@DOC_ROOT@|$source_root|g" \
            compatibility/wine/systemd/haven-compatd.service.in > "$rendered"
          ! grep -Eq '@(PYTHON|SOURCE_ROOT|DOC_ROOT)@' "$rendered"
          systemd-analyze --user verify "$rendered"

      - name: Run compatibility tests
        run: python -m unittest discover -s tests -p 'test_haven_compat*.py' -v
