# CakeOS Book4 Edge 16" boot entries. Sourced from the live ISO grub.cfg.
# The devicetree line is added only when the 16" DTB is present in the image
# at /casper/dtbs/qcom/x1e84100-samsung-galaxy-book4-edge-16.dtb.
# NOTE: GRUB lockdown (Secure Boot) forbids the devicetree command:
# disable Secure Boot (F2) before booting this image.

menuentry "CakeOS Emergency (Book4 Edge 16\" ARM64)" {
    set gfxpayload=keep
    linux /casper/vmlinuz clk_ignore_unused pd_ignore_unused quiet splash ---
    devicetree /casper/dtbs/qcom/x1e84100-samsung-galaxy-book4-edge-16.dtb
    initrd /casper/initrd
}

menuentry "CakeOS Emergency (Book4 Edge 16\" ARM64, no DTB override)" {
    set gfxpayload=keep
    linux /casper/vmlinuz clk_ignore_unused pd_ignore_unused quiet splash ---
    initrd /casper/initrd
}
